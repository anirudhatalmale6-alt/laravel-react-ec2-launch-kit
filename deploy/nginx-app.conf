# Laravel API + React SPA on one EC2 host, one domain.
#
#   https://DOMAIN/            -> React build (static, SPA fallback)
#   https://DOMAIN/api/...     -> Laravel public/index.php
#   https://DOMAIN/stripe/...  -> Laravel (webhook endpoint)
#
# Replace DOMAIN and SNIPPET_DIR. Adjust the php-fpm socket to the version
# actually installed on the box (`ls /run/php/`).
#
# Paths assumed:
#   /var/www/app/api        Laravel root (served from /var/www/app/api/public)
#   /var/www/app/web/dist   React production build
#
# Verified with `nginx -t` against a real nginx before handover.
#
# `listen 443 ssl http2;` is the legacy spelling on purpose: the separate
# `http2 on;` directive only exists from nginx 1.25.1, and Ubuntu 22.04 ships
# 1.18 and 24.04 ships 1.24. The legacy form is accepted by every version
# (1.25+ logs a deprecation warning, nothing more).

upstream php_fpm {
    server unix:/run/php/php8.3-fpm.sock;
}

# Lets the response say which backend answered, without a second add_header
# set that would clobber the security headers. Empty value = header omitted.
map $uri $app_backend {
    ~^/(api|stripe|sanctum|broadcasting|up|storage)(/|$) "laravel";
    default                                              "";
}

# ---------------------------------------------------------------- http -> https
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;

    # Left open so certbot can renew without the redirect eating the probe.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://DOMAIN$request_uri;
    }
}

# -------------------------------------------------------------- www -> apex
# A www vhost has to exist even if the site only uses the apex, or a
# certificate covering both names cannot be renewed.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://DOMAIN$request_uri;
}

# ------------------------------------------------------------------- the app
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/app/web/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 32m;

    access_log /var/log/nginx/app.access.log;
    error_log  /var/log/nginx/app.error.log warn;

    include SNIPPET_DIR/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # --- Laravel ----------------------------------------------------------
    # Every prefix the API owns is listed here; anything else falls through
    # to the SPA, which is what client-side routes need.
    location ~ ^/(api|stripe|sanctum|broadcasting|up|storage)(/|$) {
        include SNIPPET_DIR/security-headers.conf;
        try_files $uri $uri/ @laravel;
    }

    location @laravel {
        include SNIPPET_DIR/security-headers.conf;
        root /var/www/app/api/public;
        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/app/api/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/app/api/public;
        fastcgi_param HTTPS           on;
        # Stripe verifies the signature against the raw body, so the webhook
        # must not be buffered to a temp file and replayed.
        fastcgi_request_buffering off;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    # --- React ------------------------------------------------------------
    # Vite emits content-hashed filenames under /assets, so those are safe
    # to pin forever.
    location /assets/ {
        include SNIPPET_DIR/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy ships new hashed assets
    # that no returning browser ever asks for.
    location = /index.html {
        include SNIPPET_DIR/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        include SNIPPET_DIR/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # Nothing outside the API prefixes above may reach a .php file.
    location ~ \.php$ {
        return 404;
    }
}
