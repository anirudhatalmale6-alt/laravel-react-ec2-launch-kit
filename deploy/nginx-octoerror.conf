# OctoError on one EC2 instance: React SPA + Laravel API + Reverb websockets.
#
#   https://DOMAIN/              React build, SPA fallback
#   https://DOMAIN/api/v1/...    Laravel (includes the two Stripe webhooks)
#   https://DOMAIN/sanctum/...   Laravel (csrf-cookie, called by lib/api.ts)
#   wss://DOMAIN/app/<key>       Reverb, proxied to 127.0.0.1:8080
#   https://DOMAIN/apps/<id>/... Reverb's HTTP broadcast API
#
# Everything is on ONE origin on purpose. The SPA and the API share a domain,
# so Sanctum's cookie session works with no CORS and no cross-site cookie
# problems, and SANCTUM_STATEFUL_DOMAINS is just the domain itself.
#
# Replace DOMAIN and SNIPPET_DIR. Verified with nginx -t plus the functional
# checks in .rehearsal/octoerror.sh.

upstream php_fpm {
    server unix:/run/php/php8.3-fpm.sock;
}

upstream reverb {
    server 127.0.0.1:8080;
}

map $uri $app_backend {
    ~^/(api|sanctum|storage|broadcasting|up)(/|$) "laravel";
    ~^/(app|apps)(/|$)                            "reverb";
    default                                       "";
}

# Reverb speaks the Pusher protocol over a websocket, so the Upgrade header
# has to survive the proxy. An empty Connection header for non-upgrade
# requests is deliberate: sending "upgrade" unconditionally breaks plain
# HTTP calls to /apps/<id>/events.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://DOMAIN$request_uri;
    }
}

# A www vhost must exist even though the site is apex-only, or a certificate
# covering both names cannot be renewed, and that only surfaces in 60 days.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://DOMAIN$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/app/current/frontend/dist;
    index index.html;

    charset utf-8;
    # Bug attachments and dispute evidence are uploaded through the API.
    client_max_body_size 32m;

    access_log /var/log/nginx/octoerror.access.log;
    error_log  /var/log/nginx/octoerror.error.log warn;

    include SNIPPET_DIR/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # --- Reverb -----------------------------------------------------------
    location ~ ^/(app|apps)(/|$) {
        include SNIPPET_DIR/security-headers.conf;
        proxy_pass http://reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # A chat socket is idle most of the time; the default 60s would drop
        # it and the client would reconnect in a loop.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # --- Laravel ----------------------------------------------------------
    location ~ ^/(api|sanctum|storage|broadcasting|up)(/|$) {
        include SNIPPET_DIR/security-headers.conf;
        try_files $uri $uri/ @laravel;
    }

    location @laravel {
        include SNIPPET_DIR/security-headers.conf;
        root /var/www/app/current/backend/public;
        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/app/current/backend/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/app/current/backend/public;
        fastcgi_param HTTPS           on;
        # Stripe verifies the signature against the RAW body, so the webhook
        # must not be buffered to a temp file and replayed.
        fastcgi_request_buffering off;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    # --- React ------------------------------------------------------------
    location /assets/ {
        include SNIPPET_DIR/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        include SNIPPET_DIR/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        include SNIPPET_DIR/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ \.php$ {
        return 404;
    }
}
