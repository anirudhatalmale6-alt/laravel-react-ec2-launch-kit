# nginx's add_header does NOT merge: the moment a location declares one
# add_header of its own, every add_header inherited from the server block is
# dropped. So these live in a snippet and are re-included in every location
# that sets a header, instead of being written once at server level and
# silently lost on /assets/ and /index.html.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-App-Backend $app_backend always;

# HSTS stays off until the domain has served https cleanly for a few days.
# Enabling it early locks every visitor out of a broken certificate for
# max-age seconds and cannot be withdrawn.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
